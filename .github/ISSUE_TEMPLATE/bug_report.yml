name: Bug report
description: Report a reproducible gameplay, rendering, or performance issue.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. Choose a difficulty…
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130, Safari 18…
  - type: input
    id: device
    attributes:
      label: Device and screen size
      placeholder: MacBook Air, 1280×720…
